name = "starnexus-web"
pages_build_output_dir = "public"
compatibility_date = "2024-12-01"

[[d1_databases]]
binding = "DB"
database_name = "starnexus-db"
# Replace with your own D1 database ID. Create the database with
#   npx wrangler d1 create starnexus-db
# and copy the `database_id` it prints. You can also look it up later with
#   npx wrangler d1 list
# or in the Cloudflare dashboard under Workers & Pages → D1.
database_id = "<YOUR_D1_DATABASE_ID>"

